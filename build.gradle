plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java { srcDirs = ['src'] }
        resources { srcDirs = [] }
    }
    test {
        java { srcDirs = ['test'] }
        resources { srcDirs = [] }
    }
}

dependencies {
    // Game engine provided by the CSSE2002 course staff.
    implementation files('lib/engine.jar')
    testImplementation files('lib/junit-4.13.1.jar', 'lib/hamcrest-core-1.3.jar')
}

application {
    mainClass = 'Main'
}

// Sprites and maps are loaded from paths relative to the project root.
tasks.named('run') {
    workingDir = projectDir
}

tasks.named('test') {
    workingDir = projectDir
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
    }
}
